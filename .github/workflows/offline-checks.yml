name: Offline release checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python tools/setup_dataset.py --check
      - run: pytest -q -p no:cacheprovider
      - run: python tools/verify_release.py
      - run: python -m compileall -q ma4rom tools tests
